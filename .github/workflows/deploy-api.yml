name: Deploy API

on:
  push:
    branches: [nest]
    paths:
      - 'apps/api/**'
      - 'charts/api/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-api.yml'
      - '.github/secrets/.env.api'

  pull_request:
    branches: [nest]
    paths:
      - 'apps/api/**'
      - 'charts/api/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-api.yml'
      - '.github/secrets/.env.api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            asiful087/collab-grid-api:${{ steps.vars.outputs.sha_short }}
            asiful087/collab-grid-api:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        env:
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
          ACCESS_TOKEN_SECRET: ${{ secrets.API_ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRATION: ${{ secrets.API_ACCESS_TOKEN_EXPIRATION }}
          REFRESH_TOKEN_SECRET: ${{ secrets.API_REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRATION: ${{ secrets.API_REFRESH_TOKEN_EXPIRATION }}
          GOOGLE_CLIENT_ID: ${{ secrets.API_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.API_GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.API_GOOGLE_CALLBACK_URL }}
          CLIENT_URL: ${{ secrets.API_CLIENT_URL }}
          CORS_ORIGIN: ${{ secrets.API_CORS_ORIGIN }}
          PORT: ${{ secrets.API_PORT }}
          SMTP_HOST: ${{ secrets.API_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.API_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.API_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.API_SMTP_USER }}
          SMTP_PASS: ${{ secrets.API_SMTP_PASS }}
          MAIL_FROM: ${{ secrets.API_MAIL_FROM }}
          RESET_TOKEN_EXPIRATION: ${{ secrets.API_RESET_TOKEN_EXPIRATION }}
          RESET_PASSWORD_URL: ${{ secrets.API_RESET_PASSWORD_URL }}
          REDIS_URL: ${{ secrets.API_REDIS_URL }}
          RABBITMQ_URL: ${{ secrets.API_RABBITMQ_URL }}
          WS_TOKEN_SECRET: ${{ secrets.API_WS_TOKEN_SECRET }}
        run: |
          cat <<EOF > secrets.tmp.yaml
          secrets:
            DATABASE_URL: "$DATABASE_URL"
            ACCESS_TOKEN_SECRET: "$ACCESS_TOKEN_SECRET"
            ACCESS_TOKEN_EXPIRATION: "$ACCESS_TOKEN_EXPIRATION"
            REFRESH_TOKEN_SECRET: "$REFRESH_TOKEN_SECRET"
            REFRESH_TOKEN_EXPIRATION: "$REFRESH_TOKEN_EXPIRATION"
            GOOGLE_CLIENT_ID: "$GOOGLE_CLIENT_ID"
            GOOGLE_CLIENT_SECRET: "$GOOGLE_CLIENT_SECRET"
            GOOGLE_CALLBACK_URL: "$GOOGLE_CALLBACK_URL"
            CLIENT_URL: "$CLIENT_URL"
            CORS_ORIGIN: "$CORS_ORIGIN"
            PORT: "$PORT"
            SMTP_HOST: "$SMTP_HOST"
            SMTP_PORT: "$SMTP_PORT"
            SMTP_SECURE: "$SMTP_SECURE"
            SMTP_USER: "$SMTP_USER"
            SMTP_PASS: "$SMTP_PASS"
            MAIL_FROM: "$MAIL_FROM"
            RESET_TOKEN_EXPIRATION: "$RESET_TOKEN_EXPIRATION"
            RESET_PASSWORD_URL: "$RESET_PASSWORD_URL"
            REDIS_URL: "$REDIS_URL"
            RABBITMQ_URL: "$RABBITMQ_URL"
            WS_TOKEN_SECRET: "$WS_TOKEN_SECRET"
          EOF

          helm upgrade --install collabgrid-api ./charts/api \
            --namespace collab-grid --create-namespace \
            --set image.tag=${{ steps.vars.outputs.sha_short }} \
            --values secrets.tmp.yaml \
            --wait

          rm -f secrets.tmp.yaml

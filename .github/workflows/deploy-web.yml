name: Deploy Web

on:
  push:
    branches: [nestjs]
    paths:
      - "apps/web/**"
      - "infra/charts/web/**"
      - "packages/common/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches: [nestjs]
    paths:
      - "apps/web/**"
      - "infra/charts/web/**"
      - "packages/common/**"
      - ".github/workflows/deploy-web.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/production/docker/Dockerfile.web
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ secrets.WEB_NEXT_PUBLIC_GATEWAY_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.WEB_NEXT_PUBLIC_SOCKET_URL }}
          tags: |
            asiful087/collab-grid-web:${{ steps.vars.outputs.sha_short }}
            asiful087/collab-grid-web:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        env:
          NODE_ENV: ${{ secrets.WEB_NODE_ENV }}
          PORT: ${{ secrets.WEB_PORT }}
          ACCESS_TOKEN_SECRET: ${{ secrets.WEB_ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.WEB_REFRESH_TOKEN_SECRET }}
          GATEWAY_URL: ${{ secrets.WEB_GATEWAY_URL }}
        run: |
          cat <<EOF > secrets.tmp.yaml
          secrets:
            NODE_ENV: "$NODE_ENV"
            PORT: "$PORT"
            ACCESS_TOKEN_SECRET: "$ACCESS_TOKEN_SECRET"
            REFRESH_TOKEN_SECRET: "$REFRESH_TOKEN_SECRET"
            GATEWAY_URL: "$GATEWAY_URL"
          EOF

          helm upgrade --install collabgrid-web ./infra/charts/web \
            --namespace collab-grid --create-namespace \
            --set image.tag=${{ steps.vars.outputs.sha_short }} \
            --values secrets.tmp.yaml \
            --wait

          rm -f secrets.tmp.yaml

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web.fullname" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  labels:
    app: {{ include "web.name" . }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  NODE_ENV: {{ .Values.secrets.NODE_ENV | quote }}
  PORT: {{ .Values.secrets.PORT | quote }}
  ACCESS_TOKEN_SECRET: {{ .Values.secrets.ACCESS_TOKEN_SECRET | quote }}
  REFRESH_TOKEN_SECRET: {{ .Values.secrets.REFRESH_TOKEN_SECRET | quote }}
  GATEWAY_URL: {{ .Values.secrets.GATEWAY_URL | quote }}

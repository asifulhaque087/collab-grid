services:
  db:
    container_name: postgres_container
    image: postgres:13-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo
      - POSTGRES_DB=demo
      
  pgweb:
    image: sosedoff/pgweb
    container_name: collabgrid-pgweb
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://demo:demo@db:5432/demo?sslmode=disable
    depends_on:
      - db
    restart: unless-stopped
      

  redis:
    image: redis:7-alpine
    container_name: collabgrid-redis
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: collabgrid-rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI (guest / guest)
    restart: unless-stopped
